name: ci

on:
  pull_request:
    branches:
    - '**'

permissions:
  contents: read

jobs:
  lint_test:
    uses: babylonlabs-io/.github/.github/workflows/reusable_go_lint_test.yml@98e4de18638b3d0738c9cbf7e7dfc6e34524db54 # v0.19.1 https://github.com/babylonlabs-io/.github/releases/tag/v0.19.1
    with:
     go-version: 1.26.10
     go-lint-version: v2.11.4
     run-unit-tests: true
     run-integration-tests: true
     integration-tests-command: make test-integration && make test-e2e
     integration-tests-docker-auth: false
     run-lint: true
     run-build: true
     run-gosec: true
     gosec-args: "-no-fail ./..."
     
  docker_pipeline:
    uses: babylonlabs-io/.github/.github/workflows/reusable_docker_pipeline.yml@902082b8e5c0a1fed7be6980fa6a1b77fc005c06 # v0.23.0
    permissions:
      contents: read
      security-events: write
      packages: read
    with:
      publish: false
      dockerfile: ./contrib/images/staking-api-service/Dockerfile
      docker_scan: true
