name: ci

on:
  pull_request:
    branches:
    - '**'

permissions:
  contents: read

jobs:
  lint_test:
    uses: babylonlabs-io/.github/.github/workflows/reusable_go_lint_test.yml@5d014a155c08d56a1b5673d049f2b4e7d4427825 # v0.19.0 https://github.com/babylonlabs-io/.github/releases/tag/v0.19.0
    with:
     go-version: 1.24.11
     go-lint-version: v2.4.0
     run-unit-tests: true
     run-integration-tests: true
     integration-tests-command: make test-integration && make test-e2e
     integration-tests-docker-auth: false
     run-lint: true
     run-build: true
     run-gosec: true
     gosec-args: "-no-fail ./..."
     
  docker_pipeline:
    uses: babylonlabs-io/.github/.github/workflows/reusable_docker_pipeline.yml@5d014a155c08d56a1b5673d049f2b4e7d4427825 # v0.19.0 https://github.com/babylonlabs-io/.github/releases/tag/v0.19.0
    secrets: inherit
    permissions:
      security-events: write
      packages: read
    with:
      publish: false
      dockerfile: ./contrib/images/staking-api-service/Dockerfile
      docker_scan: true
