name: Release Workflow

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true
        type: string
      description:
        description: 'Release description'
        required: true
        type: string
      prerelease:
        description: 'Whether prerelease is enabled'
        required: true
        type: boolean
        default: false

jobs:
  call-reusable-release:
    uses: babylonlabs-io/.github/.github/workflows/reusable_github_release.yml@98e4de18638b3d0738c9cbf7e7dfc6e34524db54 # v0.19.1 https://github.com/babylonlabs-io/.github/releases/tag/v0.19.1
    with:
      tag: ${{ inputs.tag }}
      description: ${{ inputs.description }}
      prerelease: ${{ inputs.prerelease }}
      build_command: |
        make install
      docker_image_name: babylonlabs/staking-api-service:${{ inputs.tag }}
    secrets: inherit